<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rotina de Embocadura v4 </title>
  <style>
   :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-family);
      height: 100dvh; /* MÁGICA 1: Lê a altura real da tela ignorando a barra do navegador */
      overflow: hidden; /* MÁGICA 2: Trava o site, impedindo a rolagem da página */
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    
    .app-container {
      width: 100%;
      max-width: 440px;
      height: 100%; /* Força a caixa a usar toda a altura disponível */
      max-height: 750px; /* Evita que fique muito esticado em celulares muito grandes */
      background: var(--card-bg);
      border-radius: 24px;
      padding: clamp(16px, 3vh, 24px); /* O preenchimento encolhe em telas pequenas */
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: space-between; /* Espalha os botões, textos e timer perfeitamente */
      gap: clamp(8px, 2vh, 16px);
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }
    
    .header h1 { font-size: clamp(1rem, 2.5vh, 1.1rem); font-weight: 700; color: var(--accent); }
    .day-badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    
    .exercise-header { text-align: center; }
    .phase-badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .exercise-title { font-size: clamp(1.15rem, 3vh, 1.35rem); font-weight: 700; margin-bottom: 2px; }
    .step-indicator { font-size: 0.8rem; color: var(--text-muted); }
    
    .timer-display {
      font-size: clamp(3rem, 8vh, 3.8rem); /* O número do timer diminui se a tela for pequena */
      font-weight: 800;
      text-align: center;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      margin: 0;
    }
    
    .timer-progress {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 100%;
      transition: width 0.3s linear;
    }
    
    .description-box {
      flex-grow: 1; /* MÁGICA 3: O texto absorve exatamente o espaço vazio que sobrou na tela */
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      padding: clamp(10px, 2.5vh, 14px);
      font-size: clamp(0.85rem, 2vh, 0.92rem);
      line-height: 1.45;
      color: #e2e8f0;
      white-space: pre-wrap;
      overflow-y: auto; /* Se o celular for um modelo jurássico muito pequeno, ele cria uma rolagem SÓ no texto */
    }
    
    .controls { display: flex; gap: 10px; }
    .btn {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: clamp(12px, 2.5vh, 14px) 0;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s ease;
    }
    .btn:active { opacity: 0.8; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-pause { background: var(--danger); color: #fff; }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: var(--text); }
    
    .nav-buttons { display: flex; justify-content: space-between; gap: 10px; margin-top: 0; }
    .btn-sm { padding: clamp(8px, 2vh, 10px); font-size: 0.85rem; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <h1>Rotina de Embocadura v4.2</h1>
      <button id="dayBadge" class="day-badge" onclick="toggleDay()"></button>
    </div>

    <div class="exercise-header">
      <div id="exercisePhase" class="phase-badge"></div>
      <div id="exerciseTitle" class="exercise-title"></div>
      <div id="stepIndicator" class="step-indicator"></div>
    </div>

  <div class="timer-display" id="timerDisplay">00:00</div>
    
    <!-- Coloque a instrução AQUI (fora da barra de progresso) -->
    <div id="subInstruction" style="display: none; font-size: 1.1rem; font-weight: bold; color: var(--accent); text-align: center; margin-bottom: 12px; background: rgba(56, 189, 248, 0.1); padding: 10px; border-radius: 10px;"></div>
    
    <div class="timer-progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <div class="description-box" id="exerciseDescription"></div>

    <div class="controls">
      <button id="mainBtn" class="btn btn-primary" onclick="toggleTimer()">Iniciar</button>
      <button class="btn btn-secondary" onclick="resetTimer()">Reiniciar</button>
    </div>

    <div class="nav-buttons">
      <button class="btn btn-secondary btn-sm" onclick="prevExercise()">← Anterior</button>
      <button class="btn btn-secondary btn-sm" onclick="nextExercise()">Próximo →</button>
    </div>
  </div>

  <script>
    const routineData = {
      par: [
        {
          fase: "Resistência",
          nome: "Firmeza dos Cantos",
          tempoMin: 2,
          desc: "Forme sua embocadura padrão e trave os cantos da boca. \n Segure firme até sentir queimar. \n Tente manter por mais 30 segundos após a queimação."
        },
        {
          fase: "Carga",
          nome: "O Exercício do Lápis",
          tempoMin: 2,
          desc: "•  Segure a base de um lápis usando apenas a força dos lábios, sem encostar os dentes. \n•  Mantenha-o reto para a frente até o limite da sua resistência."
        },
        {
          fase: "Tensão",
          nome: "Sustentação com Separação",
          tempoMin: 1.5,
          desc: "•  Pressione os lábios firmemente um contra o outro. \n•  Sem soltar os lábios, abra os dentes o máximo que puder dentro da boca. \n•  Segure esse alongamento."
        },
        {
          fase: "Foco",
          nome: "O Bico de Cordão",
          tempoMin: 1.5,
          desc: "•  Faça um bico exagerado. \n•  Force a musculatura para o centro, como se estivesse segurando um objeto minúsculo com os lábios. \n•  Mantenha a tensão."
        }
      ],
      impar: [
        {
          fase: "Ativação",
          nome: "Isometria no Espelho",
          tempoMin: 2,
          cicloABC: true,
          desc: "•  A) Role o lábio inferior para fora em direção ao queixo, segure por 10s, volte à posição inicial. \n•  B) Projete os lábios para frente (fazendo bico), segure por 10s. \n•  C) Role os lábios para dentro sobre os dentes até que a parte vermelha desapareça, segure por 10s. \n•  Repita o ciclo por 3 minutos."
        },
        {
          fase: "Resistência",
          nome: "Puxada para Baixo com o Dedo",
          tempoMin: 1.5,
          desc: "•  Coloque o dedo indicador no lábio inferior. Pressione o lábio sobre os dentes inferiores e puxe para baixo. \n•  Resista a esse movimento levantando ativamente o lábio inferior para cima e afastando-o dos dentes usando os músculos faciais. \n•  Mantenha a resistência por 30 a 40 segundos. Descanse e repita."
        },
        {
          fase: "Velocidade / Queimação",
          nome: "Falha de Bico e Sorriso",
          tempoMin: 1.5,
          desc: "•  Faça o bico mais exagerado e concentrado possível e, em seguida, mude instantaneamente para o sorriso mais largo que conseguir.\n•  Alterne o mais rápido possível até os músculos queimarem completamente."
        },
        {
          fase: "Isolamento",
          nome: "O Abraço Interno de 'Mmm'",
          tempoMin: 2,
          desc: "•  Mantenha os lábios fechados (fazendo 'mmm'). \n•  Puxe os músculos dos lábios para dentro em direção ao centro, como se estivessem 'abraçando' os dentes. \n•  Mantenha os cantos da boca completamente neutros (sem sorrir ou fazer expressão de tristeza). \n•  Segure até sentir os músculos queimarem."
        }
      ]
    };

    let currentDayMode = new Date().getDate() % 2 === 0 ? "par" : "impar";
    let currentIndex = 0;
    let totalSeconds = 0;
    let remainingSeconds = 0;
    let timerInterval = null;
    let audioCtx = null;

    function playBeep(freq = 880, duration = 0.2, count = 1) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let delay = 0;
        for (let i = 0; i < count; i++) {
          setTimeout(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
          }, delay * 1000);
          delay += duration + 0.1;
        }
      } catch (e) {}
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateUI() {
      const list = routineData[currentDayMode];
      const ex = list[currentIndex];

      document.getElementById("dayBadge").textContent = currentDayMode === "par" ? "Dia Par (Hoje)" : "Dia Ímpar (Hoje)";
      document.getElementById("exercisePhase").textContent = `Fase: ${ex.fase}`;
      document.getElementById("exerciseTitle").textContent = ex.nome;
      document.getElementById("stepIndicator").textContent = `Exercício ${currentIndex + 1} de ${list.length}`;
      document.getElementById("exerciseDescription").textContent = ex.desc;

      document.getElementById("timerDisplay").textContent = formatTime(remainingSeconds);
      const progressPercent = totalSeconds > 0 ? (remainingSeconds / totalSeconds) * 100 : 0;
      document.getElementById("progressBar").style.width = `${progressPercent}%`;
// Lógica do Ciclo Visual A-B-C a cada 10s
      const subInstruction = document.getElementById("subInstruction");
      if (ex.cicloABC && totalSeconds > 0) {
        subInstruction.style.display = "block";
        
        // Calcula quanto tempo já passou para saber em qual ciclo estamos
        const tempoDecorrido = totalSeconds - remainingSeconds;
        
        // Descobre se estamos no bloco 0 (A), 1 (B) ou 2 (C)
        const cicloAtual = Math.floor((tempoDecorrido % 30) / 10); 
        
        // Calcula os segundos restantes para a próxima troca (10 a 1)
        const segundosParaTroca = 10 - (tempoDecorrido % 10);

        if (cicloAtual === 0) {
          subInstruction.innerHTML = `Posição A: Lábio para fora <br><small>Troca em: ${segundosParaTroca}s</small>`;
        } else if (cicloAtual === 1) {
          subInstruction.innerHTML = `Posição B: Bico para frente <br><small>Troca em: ${segundosParaTroca}s</small>`;
        } else {
          subInstruction.innerHTML = `Posição C: Lábios para dentro <br><small>Troca em: ${segundosParaTroca}s</small>`;
        }
      } else {
        subInstruction.style.display = "none";
      }
      const mainBtn = document.getElementById("mainBtn");
      if (timerInterval) {
        mainBtn.textContent = "Pausar";
        mainBtn.className = "btn btn-pause";
      } else {
        mainBtn.textContent = remainingSeconds === totalSeconds ? "Iniciar" : "Continuar";
        mainBtn.className = "btn btn-primary";
      }
    }

    function loadExercise(index) {
      clearInterval(timerInterval);
      timerInterval = null;
      currentIndex = index;
      const ex = routineData[currentDayMode][currentIndex];
      totalSeconds = ex.tempoMin * 60;
      remainingSeconds = totalSeconds;
      updateUI();
    }

    function toggleTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      } else {
        if (remainingSeconds <= 0) return;
        timerInterval = setInterval(() => {
          remainingSeconds--;
          updateUI();
          if (remainingSeconds <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            playBeep(980, 0.25, 3);
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            updateUI();
          }
        }, 1000);
      }
      updateUI();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      const ex = routineData[currentDayMode][currentIndex];
      totalSeconds = ex.tempoMin * 60;
      remainingSeconds = totalSeconds;
      updateUI();
    }

    function nextExercise() {
      const list = routineData[currentDayMode];
      if (currentIndex < list.length - 1) {
        loadExercise(currentIndex + 1);
      }
    }

    function prevExercise() {
      if (currentIndex > 0) {
        loadExercise(currentIndex - 1);
      }
    }

    function toggleDay() {
      currentDayMode = currentDayMode === "par" ? "impar" : "par";
      loadExercise(0);
    }

    // Inicialização
    loadExercise(0);
  </script>
</body>
</html>
